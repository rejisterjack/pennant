<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="pn-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f2420" />
      <stop offset="60%" stop-color="#071210" />
      <stop offset="100%" stop-color="#030807" />
    </radialGradient>
    <linearGradient id="pn-stroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.55)" />
      <stop offset="50%" stop-color="rgba(20, 184, 166, 0.25)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.10)" />
    </linearGradient>
    <linearGradient id="pn-teal" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="pn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#pn-bg)" stroke="url(#pn-stroke)" stroke-width="6" />
  <circle cx="256" cy="256" r="130" fill="#10b981" opacity="0.12" filter="url(#pn-glow)" />

  <g transform="translate(0, -6)">
    <!-- Flagpole Mast -->
    <line x1="160" y1="96" x2="160" y2="400" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
    <circle cx="160" cy="96" r="10" fill="#f8fafc" />

    <!-- Dynamic Double-Swallowtail Pennant Flag -->
    <path d="M 160 116 L 372 176 L 310 232 L 372 288 L 160 348 Z" 
          fill="url(#pn-teal)" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linejoin="round" />

    <!-- Feature Flag Toggle Switch Capsule -->
    <rect x="194" y="208" width="88" height="48" rx="24" fill="#030807" stroke="#34d399" stroke-width="6" />
    <!-- Active Green Toggle State Node -->
    <circle cx="258" cy="232" r="16" fill="#34d399" filter="url(#pn-glow)" />
    <circle cx="258" cy="232" r="8" fill="#ffffff" />
  </g>
</svg>

