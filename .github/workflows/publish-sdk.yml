name: Publish SDK

on:
  push:
    branches: [main]

jobs:
  publish:
    if: "startsWith(github.event.head_commit.message, 'release: sdk-v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the release commit matches the package version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          tag=${subject#"release: "}
          tag=${tag%%[[:space:]]*}
          tag=${tag%$'\r'}
          if ! printf '%s' "$tag" | grep -Eq '^sdk-v[0-9][0-9A-Za-z._+-]*$'; then
            echo "commit subject must start with release: sdk-vX.Y.Z (got: ${tag})"
            exit 1
          fi
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          test "$tag" = "sdk-v${VERSION}"
          git tag -f "$tag"
      - run: npm run build -w @rejisterjack/pennant
      - run: npm publish -w @rejisterjack/pennant --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
