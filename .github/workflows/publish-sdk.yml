name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF#refs/tags/sdk-v}"
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          test "$TAG" = "$VERSION"
      - run: npm run build -w @rejisterjack/pennant
      - run: npm publish -w @rejisterjack/pennant --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
